<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WeatherGPT Map & Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script>
    // Alias mapboxgl to maplibregl for seamless compatibility
    window.mapboxgl = window.maplibregl;
  </script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0F172A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100%; }
    
    .legend {
      position: absolute;
      bottom: 24px;
      left: 12px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F1F5F9;
      font-size: 11px;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .legend-title { font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; color: #94A3B8; font-size: 10px; }
    .legend-bar { width: 140px; height: 8px; border-radius: 4px; margin-bottom: 4px; }
    .legend-bar-temp { background: linear-gradient(to right, #313695, #74add1, #ffffbf, #f46d43, #a50026); }
    .legend-bar-radar { background: linear-gradient(to right, transparent, #9ecae1, #4292c6, #41ab5d, #feb24c, #ef3b2c, #67000d); }
    .legend-labels { display: flex; justify-content: space-between; color: #CBD5E1; font-size: 9px; font-weight: 600; }
    .attribution-badge { position: absolute; bottom: 8px; right: 8px; font-size: 9px; color: rgba(255,255,255,0.5); z-index: 10; pointer-events: none; }

    /* Radar Time-Lapse Scrubber */
    .radar-player {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      color: #F8FAFC;
      font-size: 12px;
      font-weight: 600;
    }
    .radar-btn {
      background: #38BDF8;
      color: #0F172A;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .radar-btn:hover {
      transform: scale(1.08);
      background: #7DD3FC;
    }
    .radar-time {
      color: #38BDF8;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .radar-slider {
      accent-color: #38BDF8;
      cursor: pointer;
      width: 100px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Radar Time Controller -->
  <div class="radar-player" id="radarPlayer">
    <button class="radar-btn" id="playPauseBtn" onclick="togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></button>
    <input type="range" id="radarSlider" class="radar-slider" min="0" max="0" value="0" oninput="onSliderChange(this.value)" />
    <span class="radar-time" id="radarTimeLabel">LIVE RADAR</span>
  </div>

  <div class="legend" id="legend">
    <div class="legend-title" id="legendTitle">Temperature (°C)</div>
    <div class="legend-bar legend-bar-temp" id="legendBar"></div>
    <div class="legend-labels" id="legendLabels">
      <span>-5°</span><span>10°</span><span>25°</span><span>35°</span><span>45°+</span>
    </div>
  </div>
  <div class="attribution-badge">WeatherGPT · OWM · IMD · RainViewer</div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'temp'; // 'temp' or 'radar'
    const token = urlParams.get('token') || window.MAPBOX_TOKEN || '';
    const initLat = parseFloat(urlParams.get('lat')) || 20.5937;
    const initLon = parseFloat(urlParams.get('lon')) || 78.9629;
    const initZoom = parseFloat(urlParams.get('zoom')) || 4.2;
    const apiBase = urlParams.get('apiBase') || window.location.origin;

    // Open free raster style for 100% token-free open basemap
    const freeBasemapStyle = {
      version: 8,
      sources: {
        'basemap': {
          type: 'raster',
          tiles: mode === 'radar' 
            ? [
                'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'
              ]
            : [
                'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
                'https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
                'https://c.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png'
              ],
          tileSize: 256,
          attribution: '&copy; CARTO &copy; OpenStreetMap'
        }
      },
      layers: [
        {
          id: 'basemap-layer',
          type: 'raster',
          source: 'basemap',
          minzoom: 0,
          maxzoom: 20
        }
      ]
    };

    // Use freeBasemapStyle directly for zero-token reliability
    const map = new mapboxgl.Map({
      container: 'map',
      style: freeBasemapStyle,
      center: [initLon, initLat],
      zoom: initZoom,
      attributionControl: false
    });

    map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-right');

    map.on('load', () => {
      if (mode === 'temp') {
        setupTemperatureMode();
      } else {
        setupRadarMode();
      }
    });

    function setupTemperatureMode() {
      document.getElementById('legendTitle').innerText = 'Temperature (°C)';
      document.getElementById('legendBar').className = 'legend-bar legend-bar-temp';
      document.getElementById('legendLabels').innerHTML = '<span>-5°</span><span>15°</span><span>25°</span><span>35°</span><span>45°+</span>';
      document.getElementById('radarPlayer').style.display = 'none';

      // Load Heatmap points
      fetch(`${apiBase}/v1/maps/temperature-heatmap`)
        .then(res => res.json())
        .then(data => {
          map.addSource('temp-points', {
            type: 'geojson',
            data: data
          });

          // Heatmap layer
          map.addLayer({
            id: 'temp-heatmap',
            type: 'heatmap',
            source: 'temp-points',
            paint: {
              'heatmap-weight': [
                'interpolate', ['linear'], ['get', 'temperature_c'],
                -5, 0.0,
                10, 0.2,
                25, 0.5,
                35, 0.8,
                45, 1.0
              ],
              'heatmap-intensity': [
                'interpolate', ['linear'], ['zoom'],
                3, 0.5,
                9, 1.5
              ],
              'heatmap-color': [
                'interpolate', ['linear'], ['heatmap-density'],
                0.0, 'rgba(0,0,0,0)',
                0.15, '#313695',
                0.35, '#74add1',
                0.55, '#ffffbf',
                0.75, '#f46d43',
                0.95, '#a50026'
              ],
              'heatmap-radius': [
                'interpolate', ['linear'], ['zoom'],
                3, 20,
                9, 45
              ],
              'heatmap-opacity': 0.82
            }
          });

          // Circle layer for zoomed-in inspection
          map.addLayer({
            id: 'temp-circles',
            type: 'circle',
            source: 'temp-points',
            minzoom: 6,
            paint: {
              'circle-radius': 6,
              'circle-color': '#FFFFFF',
              'circle-stroke-width': 2,
              'circle-stroke-color': '#0F172A'
            }
          });
        })
        .catch(err => console.warn('Failed loading temp points:', err));
    }

    let radarFrames = [];
    let currentFrameIdx = 0;
    let isPlaying = false;
    let playInterval = null;

    function setupRadarMode() {
      document.getElementById('legendTitle').innerText = 'Rain Radar (mm/h)';
      document.getElementById('legendBar').className = 'legend-bar legend-bar-radar';
      document.getElementById('legendLabels').innerHTML = '<span>0</span><span>1</span><span>4</span><span>8</span><span>16</span><span>32+</span>';
      document.getElementById('radarPlayer').style.display = 'flex';

      // Load radar configuration & frames
      fetch(`${apiBase}/v1/maps/rain-radar`)
        .then(res => res.json())
        .then(data => {
          if (data.frames && data.frames.length > 0) {
            radarFrames = data.frames;
            currentFrameIdx = radarFrames.length - 1;

            const slider = document.getElementById('radarSlider');
            slider.max = radarFrames.length - 1;
            slider.value = currentFrameIdx;

            const tileTemplate = radarFrames[currentFrameIdx].tile_url_template;
            map.addSource('rain-radar-source', {
              type: 'raster',
              tiles: [tileTemplate],
              tileSize: 256
            });

            map.addLayer({
              id: 'rain-radar-layer',
              type: 'raster',
              source: 'rain-radar-source',
              paint: {
                'raster-opacity': 0.75,
                'raster-fade-duration': 0
              }
            });

            updateFrameDisplay();
          }

          // Load IMD Warning Polygons on top
          fetch(`${apiBase}/v1/maps/imd-polygons`)
            .then(res => res.json())
            .then(polyGeoJson => {
              if (polyGeoJson && polyGeoJson.features && polyGeoJson.features.length > 0) {
                map.addSource('imd-warning-polys', {
                  type: 'geojson',
                  data: polyGeoJson
                });

                map.addLayer({
                  id: 'imd-warning-fills',
                  type: 'fill',
                  source: 'imd-warning-polys',
                  paint: {
                    'fill-color': ['get', 'fillColor'],
                    'fill-opacity': 0.35
                  }
                });

                map.addLayer({
                  id: 'imd-warning-lines',
                  type: 'line',
                  source: 'imd-warning-polys',
                  paint: {
                    'line-color': ['get', 'lineColor'],
                    'line-width': 2
                  }
                });
              }
            })
            .catch(() => {});
        })
        .catch(err => console.warn('Failed loading radar frames:', err));
    }

    function onSliderChange(val) {
      currentFrameIdx = parseInt(val, 10);
      setRadarFrame(currentFrameIdx);
    }

    function setRadarFrame(idx) {
      if (!radarFrames[idx]) return;
      const frame = radarFrames[idx];
      const source = map.getSource('rain-radar-source');
      if (source) {
        source.tiles = [frame.tile_url_template];
        // Reload tiles by removing and re-adding layer or tile cache
        if (map.getLayer('rain-radar-layer')) {
          map.removeLayer('rain-radar-layer');
          map.removeSource('rain-radar-source');
          map.addSource('rain-radar-source', {
            type: 'raster',
            tiles: [frame.tile_url_template],
            tileSize: 256
          });
          map.addLayer({
            id: 'rain-radar-layer',
            type: 'raster',
            source: 'rain-radar-source',
            paint: {
              'raster-opacity': 0.75,
              'raster-fade-duration': 0
            }
          });
        }
      }
      document.getElementById('radarSlider').value = idx;
      updateFrameDisplay();
    }

    function updateFrameDisplay() {
      const isLive = currentFrameIdx === radarFrames.length - 1;
      const label = document.getElementById('radarTimeLabel');
      if (isLive) {
        label.innerHTML = '<i class="fa-solid fa-circle" style="color: #10B981; font-size: 8px;"></i> LIVE RADAR';
      } else {
        const diffMins = (radarFrames.length - 1 - currentFrameIdx) * 10;
        label.innerText = `-${diffMins} MINS`;
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const icon = document.getElementById('playIcon');
      if (isPlaying) {
        icon.className = 'fa-solid fa-pause';
        playInterval = setInterval(() => {
          currentFrameIdx = (currentFrameIdx + 1) % radarFrames.length;
          setRadarFrame(currentFrameIdx);
        }, 800);
      } else {
        icon.className = 'fa-solid fa-play';
        clearInterval(playInterval);
      }
    }

    // ── Crowdsourced Citizen Hazard Pins ──
    function loadCitizenReports() {
      fetch(`${apiBase}/v1/reports`)
        .then(res => res.json())
        .then(geoJson => {
          if (!geoJson || !geoJson.features) return;

          if (map.getSource('citizen-reports-source')) {
            map.getSource('citizen-reports-source').setData(geoJson);
            return;
          }

          map.addSource('citizen-reports-source', {
            type: 'geojson',
            data: geoJson
          });

          // Outer aura ring
          map.addLayer({
            id: 'citizen-reports-glow',
            type: 'circle',
            source: 'citizen-reports-source',
            paint: {
              'circle-radius': 14,
              'circle-color': ['get', 'color'],
              'circle-opacity': 0.3,
              'circle-stroke-width': 1.5,
              'circle-stroke-color': ['get', 'color']
            }
          });

          // Inner solid pin
          map.addLayer({
            id: 'citizen-reports-pin',
            type: 'circle',
            source: 'citizen-reports-source',
            paint: {
              'circle-radius': 7,
              'circle-color': ['get', 'color'],
              'circle-stroke-width': 2,
              'circle-stroke-color': '#FFFFFF'
            }
          });

          // Click popup
          map.on('click', 'citizen-reports-pin', (e) => {
            if (!e.features || !e.features[0]) return;
            const p = e.features[0].properties;
            const coords = e.features[0].geometry.coordinates.slice();

            const popupHtml = `
              <div style="font-family: -apple-system, sans-serif; padding: 4px; color: #0F172A; max-width: 220px;">
                <div style="font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
                  <span>${p.hazard_icon}</span>
                  <span style="text-transform: capitalize;">${p.hazard_type.replace('_', ' ')}</span>
                  <span style="font-size: 9px; background: #EF4444; color: #FFF; padding: 1px 6px; border-radius: 999px; text-transform: uppercase;">${p.severity}</span>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px;">📍 ${p.location_name}</div>
                <div style="font-size: 11px; color: #475569; margin-bottom: 6px;">"${p.description}"</div>
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #64748B; border-top: 1px solid #E2E8F0; padding-top: 4px;">
                  <span>By: ${p.reporter_alias}</span>
                  <span style="color: #059669; font-weight: 700;">👍 ${p.upvotes} verified</span>
                </div>
              </div>
            `;

            new mapboxgl.Popup({ offset: 10 })
              .setLngLat(coords)
              .setHTML(popupHtml)
              .addTo(map);
          });

          map.on('mouseenter', 'citizen-reports-pin', () => {
            map.getCanvas().style.cursor = 'pointer';
          });
          map.on('mouseleave', 'citizen-reports-pin', () => {
            map.getCanvas().style.cursor = '';
          });
        })
        .catch(err => console.debug('Citizen reports load notice:', err));
    }

    // Hook citizen reports on map load
    map.on('load', () => {
      setTimeout(loadCitizenReports, 500);
    });
  </script>
</body>
</html>
