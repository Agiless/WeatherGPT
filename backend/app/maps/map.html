<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WeatherGPT Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0F172A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100%; }
    .legend {
      position: absolute;
      bottom: 24px;
      left: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #F1F5F9;
      font-size: 11px;
      z-index: 10;
      pointer-events: none;
    }
    .legend-title { font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; color: #94A3B8; font-size: 10px; }
    .legend-bar { width: 140px; height: 8px; border-radius: 4px; margin-bottom: 4px; }
    .legend-bar-temp { background: linear-gradient(to right, #313695, #74add1, #ffffbf, #f46d43, #a50026); }
    .legend-bar-radar { background: linear-gradient(to right, transparent, #9ecae1, #4292c6, #41ab5d, #feb24c, #ef3b2c, #67000d); }
    .legend-labels { display: flex; justify-content: space-between; color: #CBD5E1; font-size: 9px; font-weight: 600; }
    .attribution-badge { position: absolute; bottom: 8px; right: 8px; font-size: 9px; color: rgba(255,255,255,0.5); z-index: 10; pointer-events: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="legend" id="legend">
    <div class="legend-title" id="legendTitle">Temperature (°C)</div>
    <div class="legend-bar legend-bar-temp" id="legendBar"></div>
    <div class="legend-labels" id="legendLabels">
      <span>-5°</span><span>10°</span><span>25°</span><span>35°</span><span>45°+</span>
    </div>
  </div>
  <div class="attribution-badge">WeatherGPT · OWM · IMD</div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'temp'; // 'temp' or 'radar'
    const token = urlParams.get('token') || window.MAPBOX_TOKEN;
    const initLat = parseFloat(urlParams.get('lat')) || 20.5937;
    const initLon = parseFloat(urlParams.get('lon')) || 78.9629;
    const initZoom = parseFloat(urlParams.get('zoom')) || 4.2;
    const apiBase = urlParams.get('apiBase') || window.location.origin;

    mapboxgl.accessToken = token;

    const styleUrl = mode === 'radar' 
      ? 'mapbox://styles/mapbox/dark-v11' 
      : 'mapbox://styles/mapbox/outdoors-v12';

    const map = new mapboxgl.Map({
      container: 'map',
      style: styleUrl,
      center: [initLon, initLat],
      zoom: initZoom,
      attributionControl: false
    });

    map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-right');

    map.on('load', () => {
      if (mode === 'temp') {
        setupTemperatureMode();
      } else {
        setupRadarMode();
      }
    });

    function setupTemperatureMode() {
      document.getElementById('legendTitle').innerText = 'Temperature (°C)';
      document.getElementById('legendBar').className = 'legend-bar legend-bar-temp';
      document.getElementById('legendLabels').innerHTML = '<span>-5°</span><span>15°</span><span>25°</span><span>35°</span><span>45°+</span>';

      // Load Heatmap points
      fetch(`${apiBase}/v1/maps/temperature-heatmap`)
        .then(res => res.json())
        .then(data => {
          map.addSource('temp-points', {
            type: 'geojson',
            data: data
          });

          // Heatmap layer
          map.addLayer({
            id: 'temp-heatmap',
            type: 'heatmap',
            source: 'temp-points',
            paint: {
              'heatmap-weight': [
                'interpolate', ['linear'], ['get', 'temperature_c'],
                -5, 0.0,
                10, 0.2,
                25, 0.5,
                35, 0.8,
                45, 1.0
              ],
              'heatmap-intensity': [
                'interpolate', ['linear'], ['zoom'],
                3, 0.5,
                9, 1.5
              ],
              'heatmap-color': [
                'interpolate', ['linear'], ['heatmap-density'],
                0.0, 'rgba(0,0,0,0)',
                0.15, '#313695',
                0.35, '#74add1',
                0.55, '#ffffbf',
                0.75, '#f46d43',
                0.95, '#a50026'
              ],
              'heatmap-radius': [
                'interpolate', ['linear'], ['zoom'],
                3, 20,
                9, 45
              ],
              'heatmap-opacity': 0.82
            }
          });

          // Circle layer for zoomed-in inspection
          map.addLayer({
            id: 'temp-circles',
            type: 'circle',
            source: 'temp-points',
            minzoom: 6,
            paint: {
              'circle-radius': 6,
              'circle-color': '#FFFFFF',
              'circle-stroke-width': 2,
              'circle-stroke-color': '#0F172A'
            }
          });

          map.on('click', 'temp-circles', (e) => {
            if (e.features && e.features[0]) {
              const props = e.features[0].properties;
              if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                  type: 'POINT_TAP',
                  data: props
                }));
              }
            }
          });
        })
        .catch(err => console.warn('Failed loading temp points:', err));
    }

    function setupRadarMode() {
      document.getElementById('legendTitle').innerText = 'Rain Radar (mm/h)';
      document.getElementById('legendBar').className = 'legend-bar legend-bar-radar';
      document.getElementById('legendLabels').innerHTML = '<span>0</span><span>1</span><span>4</span><span>8</span><span>16</span><span>32+</span>';

      // Load radar configuration & frames
      fetch(`${apiBase}/v1/maps/rain-radar`)
        .then(res => res.json())
        .then(data => {
          if (data.frames && data.frames.length > 0) {
            const tileTemplate = data.frames[0].tile_url_template;
            map.addSource('rain-radar-source', {
              type: 'raster',
              tiles: [tileTemplate],
              tileSize: 256
            });

            map.addLayer({
              id: 'rain-radar-layer',
              type: 'raster',
              source: 'rain-radar-source',
              paint: {
                'raster-opacity': 0.72,
                'raster-fade-duration': 0
              }
            });
          }

          // Load IMD Warning Polygons on top
          fetch(`${apiBase}/v1/maps/imd-polygons`)
            .then(res => res.json())
            .then(polyGeoJson => {
              if (polyGeoJson && polyGeoJson.features && polyGeoJson.features.length > 0) {
                map.addSource('imd-warning-polys', {
                  type: 'geojson',
                  data: polyGeoJson
                });

                map.addLayer({
                  id: 'imd-warning-fills',
                  type: 'fill',
                  source: 'imd-warning-polys',
                  paint: {
                    'fill-color': ['get', 'fillColor'],
                    'fill-opacity': 0.35
                  }
                });

                map.addLayer({
                  id: 'imd-warning-lines',
                  type: 'line',
                  source: 'imd-warning-polys',
                  paint: {
                    'line-color': ['get', 'lineColor'],
                    'line-width': 2
                  }
                });
              }
            })
            .catch(() => {});
        })
        .catch(err => console.warn('Failed loading radar frames:', err));
    }
  </script>
</body>
</html>
